<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Second-Brain Recorder — 3D Board Mockup</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; font-family: -apple-system, system-ui, sans-serif; }
  #info {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(20,24,33,.85); border: 1px solid #30363d; border-radius: 10px;
    padding: 12px 14px; color: #e6edf3; max-width: 280px; backdrop-filter: blur(6px);
  }
  #info h1 { font-size: 14px; margin: 0 0 4px; }
  #info p { font-size: 11px; margin: 0 0 8px; color: #8b949e; line-height: 1.4; }
  .legend { display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
  .legend div { display: flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 auto; }
  #hint { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    color: #6e7681; font-size: 11px; z-index: 10; }
  #err { position: fixed; top: 12px; right: 12px; z-index: 20; color:#ff7b72;
    font-size:12px; background:rgba(20,24,33,.9); padding:8px 10px; border-radius:8px; display:none; max-width:320px;}
  .dim { color:#58a6ff; font-weight:600; }
</style>
</head>
<body>
<div id="info">
  <h1>🧠 Second-Brain Recorder</h1>
  <p>Single-board, all-SMD · approx <span class="dim">22 × 42 mm</span>, 2-layer.<br>RP2040 + NAND flash, appears as a USB drive. Cosmetic mockup — dimensions are real datasheet values.</p>
  <div class="legend" id="legend"></div>
</div>
<div id="hint">drag to orbit · scroll to zoom · right-drag to pan</div>
<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

window.addEventListener('error', e => {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = 'Error: ' + (e.message || e);
});

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(38, 42, 50);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 1.1);
key.position.set(30, 50, 25); scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
fill.position.set(-30, 20, -25); scene.add(fill);

// PCB: 1 unit = 1 mm. 22 wide (x) x 42 long (z). z: -21..+21
const BW = 22, BL = 42, BT = 1.6;
scene.add(new THREE.Mesh(
  new THREE.BoxGeometry(BW, BT, BL),
  new THREE.MeshStandardMaterial({ color: 0x0a5f38, roughness: .6, metalness: .1 })
));
const top = BT/2;
scene.add(new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(BW, BT, BL)),
  new THREE.LineBasicMaterial({ color: 0x1f7a4d })
));

function part({ x, z, w, d, h=1.0, color, label, lcolor='#e6edf3' }) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color, roughness: .5, metalness: .25 })
  );
  m.position.set(x, top + h/2, z);
  scene.add(m);
  if (label) addLabel(label, x, top + h + 1.5, z, lcolor);
  return m;
}

function addLabel(text, x, y, z, color='#e6edf3') {
  const pad = 8, fs = 40;
  const c = document.createElement('canvas');
  let ctx = c.getContext('2d');
  ctx.font = `bold ${fs}px sans-serif`;
  const w = ctx.measureText(text).width;
  c.width = w + pad*2; c.height = fs + pad*2;
  ctx = c.getContext('2d');
  ctx.font = `bold ${fs}px sans-serif`;
  ctx.fillStyle = 'rgba(13,17,23,.8)';
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle = color; ctx.textBaseline = 'middle';
  ctx.fillText(text, pad, c.height/2);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  const s = 0.06; sp.scale.set(c.width*s, c.height*s, 1);
  sp.position.set(x, y, z);
  sp.renderOrder = 999;
  scene.add(sp);
}

// --- components, real datasheet dims (w = x-extent, d = z-extent) ---
// RP2040 QFN-56 : 7.0 x 7.0 x 0.9
part({ x:0,    z:2,    w:7.0,  d:7.0,  h:0.9, color:0x14181d, label:'RP2040', lcolor:'#79c0ff' });
// USB-C 16P SMD : 8.94 x 7.25 x 3.26 (top edge, overhanging)
part({ x:0,    z:19.0, w:8.94, d:7.25, h:3.26, color:0xb8bec8, label:'USB-C', lcolor:'#ffd479' });
// W25N01 NAND (storage) SOIC-8 : 5.3 x 5.3 x 1.5
part({ x:-7,   z:2,    w:5.3,  d:5.3,  h:1.5, color:0x14181d, label:'NAND 128MB', lcolor:'#a5d6ff' });
// W25Q boot flash SOIC-8 : 5.3 x 4.0 x 1.5
part({ x:7,    z:2,    w:4.0,  d:5.3,  h:1.5, color:0x14181d, label:'BOOT', lcolor:'#a5d6ff' });
// 12 MHz crystal 3225 : 3.2 x 2.5 x 0.8
part({ x:0,    z:9,    w:3.2,  d:2.5,  h:0.8, color:0x9aa1ab, label:'XTAL' });
// MEMS mic MSM261 : 3.5 x 2.65 x 0.98
part({ x:-7.5, z:10,   w:3.5,  d:2.65, h:0.98, color:0x14181d, label:'MIC', lcolor:'#d2a8ff' });
// TP4056 charger ESOP-8 : 3.9 x 4.9 x 1.5
part({ x:-6,   z:-7,   w:3.9,  d:4.9,  h:1.5, color:0x14181d, label:'TP4056', lcolor:'#ff7b72' });
// ME6211 LDO SOT-23-5 : 1.6 x 2.9 x 1.1
part({ x:6,    z:-7,   w:1.6,  d:2.9,  h:1.1, color:0x14181d, label:'LDO', lcolor:'#7ee787' });
// Tact switches SMD 3x4 : 3.9 x 2.9 x 1.7
part({ x:7.5,  z:11,   w:3.9,  d:2.9,  h:1.7, color:0x30363d, label:'BOOT/USR' });
part({ x:-7.5, z:-14,  w:3.9,  d:2.9,  h:1.7, color:0x30363d, label:'RST' });
// LED 0805 : 2.0 x 1.25 x 0.7
part({ x:7.5,  z:-14,  w:2.0,  d:1.25, h:0.7, color:0xff4d4d, label:'LED', lcolor:'#ff9b9b' });
// 0805 passives
const passivePos = [[-3,-1],[0,-1],[3,-1],[-3,5],[3,5],[-9,5],[9,5],[-9,-3],[9,-3],[0,-11],[-3,-11],[3,-11],[0,14],[ -9,11],[9,-9]];
for (const [px,pz] of passivePos) part({ x:px, z:pz, w:2.0, d:1.25, h:0.7, color:0xd8c089 });

const grid = new THREE.GridHelper(120, 24, 0x21262d, 0x161b22);
grid.position.y = -8; scene.add(grid);

const legend = [
  ['#79c0ff','RP2040 MCU (no radio)'],
  ['#ffd479','USB-C (charge + USB drive)'],
  ['#a5d6ff','SPI NAND flash + boot flash'],
  ['#ff7b72','TP4056 Li-Po charger'],
  ['#7ee787','3.3V LDO'],
  ['#d2a8ff','MEMS microphone'],
  ['#d8c089','0805 passives'],
];
const lg = document.getElementById('legend');
for (const [c,t] of legend) {
  const row = document.createElement('div');
  row.innerHTML = `<span class="sw" style="background:${c}"></span><span>${t}</span>`;
  lg.appendChild(row);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
